<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal Rapot Sisipan - SMAN 1 Wongsorejo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Menggunakan Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        /* Animasi loading mewah berputar */
        @keyframes spinCustom { 
            100% { transform: rotate(360deg); } 
        }
        .animate-spin-custom { 
            display: inline-block; 
            animation: spinCustom 0.8s linear infinite; 
        }

        /* Ambient Light & Background Luxury Animation */
        @keyframes ambientGlow {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.15); }
            66% { transform: translate(-40px, 40px) scale(0.9); }
        }
        .ambient-blob-1 { animation: ambientGlow 14s ease-in-out infinite; }
        .ambient-blob-2 { animation: ambientGlow 18s ease-in-out infinite reverse; }

        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex flex-col items-center justify-center min-h-screen relative overflow-hidden font-sans selection:bg-sky-500 selection:text-white p-4">

    <!-- Ambient Light Background Effects (Mewah & Estetik) -->
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-sky-500/15 rounded-full blur-[120px] ambient-blob-1 pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-indigo-500/15 rounded-full blur-[120px] ambient-blob-2 pointer-events-none"></div>

    <!-- Main Container Card dengan Efek Glassmorphism Profesional -->
    <div class="relative z-10 bg-white/95 backdrop-blur-2xl p-8 md:p-10 rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.3)] w-full max-w-md border border-white/20 transform transition-all duration-500">
        
        <!-- Header dengan Logo & Judul -->
        <div class="flex flex-col items-center mb-8">
            <div class="mb-4 p-3.5 bg-slate-50 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center transition-transform duration-300 hover:scale-105">
                <img src="https://i.ibb.co.com/zTHpGJ3W/20260513-105333-0000.png" alt="Logo Sekolah" style="width: 190px;" class="h-auto object-contain drop-shadow-sm">
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight text-center">Portal Rapot Sisipan</h2>
            <p class="text-xs text-slate-500 mt-1.5 font-medium tracking-wide text-center">SMAN 1 Wongsorejo • Silakan Masuk ke Akun Anda</p>
        </div>
        
        <!-- Notifikasi Error -->
        <div id="error-msg" class="hidden mb-6 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-2xl text-center font-semibold transition-all shadow-sm"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-slate-700 text-[11px] font-bold uppercase tracking-wider mb-2" for="username">
                    Username Akun
                </label>
                <div class="relative">
                    <input class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 px-4 text-slate-800 placeholder-slate-400 leading-tight focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all duration-300 text-xs font-semibold shadow-inner" 
                           id="username" type="text" placeholder="Maso'aghi nyamana pangghuna" required>
                </div>
            </div>
            
            <div>
                <label class="block text-slate-700 text-[11px] font-bold uppercase tracking-wider mb-2" for="password">
                    Kata Sandi (Password)
                </label>
                <div class="relative flex items-center">
                    <input class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-4 pr-16 text-slate-800 placeholder-slate-400 leading-tight focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all duration-300 text-xs font-semibold shadow-inner" 
                           id="password" type="password" placeholder="maso'aghi kata sandi" required>
                    
                    <!-- Toggle Mata (Show/Hide Password) -->
                    <button type="button" id="togglePassword" class="absolute right-4 focus:outline-none text-slate-400 hover:text-sky-600 transition-colors p-1" title="Lihat/Sembunyikan Password">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="pt-3">
                <button id="loginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 flex justify-center items-center transition-all duration-300 active:scale-[0.98] text-xs tracking-wide" type="submit">
                    <span id="btnText">Masuk ke Portal</span>
                    <div id="loading" class="hidden flex items-center gap-2">
                        <span class="animate-spin-custom text-base">⏳</span>
                        <span id="loadingText" class="text-[11px] font-medium tracking-normal normal-case">Ngereng sabbhâr manabi parlo bekto; serverna larang, bos...</span>
                    </div>
                </button>
            </div>
        </form>
    </div>

    <!-- Copyright Footer -->
    <footer class="relative z-10 mt-8 text-center text-slate-400 text-[11px] tracking-wider font-medium">
        Copyright &copy; 2026 Very_Andika All Rights Reserved
    </footer>

    <script>
        // Logika Toggle Mata (Show/Hide Password)
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>`;
            } else {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
            }
        });

        // URL Google Apps Script Backend
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymL6pCjOtQSXVoDP-01PXZBYrVv86dDx7qAjcwYrW_oIWwYgylCfL2RS8dtCXBpXKP1g/exec';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');

            // Reset UI & Tampilkan Animasi Loading Server Mahal
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-90', 'cursor-not-allowed');
            btnText.classList.add('hidden');
            loading.classList.remove('hidden');

            const payload = {
                action: 'login',
                username: user,
                password: pass
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                btn.disabled = false;
                btn.classList.remove('opacity-90', 'cursor-not-allowed');
                btnText.classList.remove('hidden');
                loading.classList.add('hidden');

                if (data.status === 'success') {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('role', data.data.role);
                    sessionStorage.setItem('username', data.data.username);
                    
                    if(data.data.role === 'Guru'){
                        sessionStorage.setItem('id_guru', data.data.id_guru);
                        sessionStorage.setItem('nama_guru', data.data.nama_guru);
                        sessionStorage.setItem('status_wali', data.data.status_wali);
                        sessionStorage.setItem('kelas_wali', data.data.kelas_wali);
                        sessionStorage.setItem('status_pembina', data.data.status_pembina);
                    }

                    if (data.data.role === 'Admin') {
                        window.location.href = 'dashboard-admin.html';
                    } else if (data.data.role === 'Guru') {
                        window.location.href = 'dashboard-guru.html';
                    }
                } else {
                    errorMsg.innerText = data.message || 'Username atau password salah.';
                    errorMsg.classList.remove('hidden');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                btn.disabled = false;
                btn.classList.remove('opacity-90', 'cursor-not-allowed');
                btnText.classList.remove('hidden');
                loading.classList.add('hidden');
                errorMsg.innerText = 'Terjadi kesalahan jaringan atau server.';
                errorMsg.classList.remove('hidden');
            });
        });

        // Proteksi Halaman Login
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                const role = sessionStorage.getItem('role');
                if (role === 'Admin') window.location.href = 'dashboard-admin.html';
                if (role === 'Guru') window.location.href = 'dashboard-guru.html';
            }
        };
    </script>
</body>
</html>
