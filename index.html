<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal Rapot Sisipan</title>
    <!-- Menggunakan Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi loading sederhana */
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.2s linear infinite;
            animation: spinner 1.2s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ambient Light & Background Animation */
        @keyframes ambientGlow {
            0%, 100% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }
        .ambient-blob-1 {
            animation: ambientGlow 8s ease-in-out infinite;
        }
        .ambient-blob-2 {
            animation: ambientGlow 10s ease-in-out infinite reverse;
        }
    </style>
</head>
<body class="bg-slate-900 flex flex-col items-center justify-center min-h-screen relative overflow-hidden font-sans selection:bg-blue-500 selection:text-white">

    <!-- Ambient Light Background Effects -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl ambient-blob-1 pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl ambient-blob-2 pointer-events-none"></div>

    <!-- Main Container Card dengan Efek Glassmorphism -->
    <div class="relative z-10 bg-white/95 backdrop-blur-xl p-8 rounded-2xl shadow-2xl shadow-black/20 w-full max-w-md border border-white/20 transform transition-all duration-300 hover:shadow-blue-500/10">
        
        <!-- Header dengan Logo (Memanjang 210px) & Judul -->
        <div class="flex flex-col items-center mb-6">
            <div class="mb-3 p-2 bg-slate-50 rounded-xl shadow-inner border border-slate-100 flex items-center justify-center transition-transform duration-300 hover:scale-105">
                <img src="https://i.ibb.co.com/zTHpGJ3W/20260513-105333-0000.png" alt="Logo Sekolah" style="width: 210px;" class="h-auto object-contain">
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Portal Rapot Sisipan</h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Silakan masuk menggunakan akun Anda</p>
        </div>
        
        <!-- Notifikasi Error -->
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl text-center font-medium transition-all"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="username">
                    Username
                </label>
                <div class="relative">
                    <input class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-slate-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200 text-sm" 
                           id="username" type="text" placeholder="Masukkan Username" required>
                </div>
            </div>
            
            <div>
                <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="password">
                    Password
                </label>
                <div class="relative flex items-center">
                    <!-- Input Password -->
                    <input class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-4 pr-20 text-slate-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200 text-sm" 
                           id="password" type="password" placeholder="••••••••••••••••" required>
                    
                    <!-- Container Ikon di Kanan (Toggle Mata & Ikon Kunci) -->
                    <div class="absolute right-3 flex items-center space-x-2 text-slate-400">
                        <!-- Toggle Mata Flat -->
                        <button type="button" id="togglePassword" class="focus:outline-none hover:text-slate-600 transition-colors" title="Lihat/Sembunyikan Password">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                        <!-- Garis Pemisah Kecil -->
                        <div class="w-[1px] h-4 bg-slate-300"></div>
                        <!-- Ikon Kunci -->
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="pt-2">
                <button id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/25 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex justify-center items-center transition-all duration-200 active:scale-[0.98]" type="submit">
                    <span>Login Masuk</span>
                    <!-- Indikator Loading disembunyikan saat default -->
                    <div id="loading" class="hidden ml-2 loader ease-linear rounded-full border-2 border-t-2 border-white/30 h-4 w-4"></div>
                </button>
            </div>
        </form>
    </div>

    <!-- Copyright Footer -->
    <footer class="relative z-10 mt-8 text-center text-slate-400 text-xs tracking-wide">
        Copyright &copy; 2026 Very_Andika All Rights Reserved
    </footer>

    <script>
        // Logika Toggle Mata (Show/Hide Password)
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                // Ubah ikon mata menjadi coret (password terlihat)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                `;
            } else {
                // Ubah kembali ke ikon mata normal
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            }
        });

        // Masukkan URL Google Apps Script Anda di sini
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymL6pCjOtQSXVoDP-01PXZBYrVv86dDx7qAjcwYrW_oIWwYgylCfL2RS8dtCXBpXKP1g/exec';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');

            // Reset UI
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            loading.classList.remove('hidden');

            // Siapkan Data JSON
            const payload = {
                action: 'login',
                username: user,
                password: pass
            };

            // Kirim POST Request menggunakan fetch
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json()) // Parsing ke JSON
            .then(data => {
                // Kembalikan tombol UI seperti semula
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                loading.classList.add('hidden');

                if (data.status === 'success') {
                    // Simpan data user di Session Storage
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('role', data.data.role);
                    sessionStorage.setItem('username', data.data.username);
                    
                    if(data.data.role === 'Guru'){
                        sessionStorage.setItem('id_guru', data.data.id_guru);
                        sessionStorage.setItem('nama_guru', data.data.nama_guru);
                        sessionStorage.setItem('status_wali', data.data.status_wali);
                        sessionStorage.setItem('kelas_wali', data.data.kelas_wali);
                    }

                    // Arahkan ke halaman Dashboard berdasarkan Role
                    if (data.data.role === 'Admin') {
                        window.location.href = 'dashboard-admin.html';
                    } else if (data.data.role === 'Guru') {
                        window.location.href = 'dashboard-guru.html';
                    }
                } else {
                    // Jika password salah / error
                    errorMsg.innerText = data.message;
                    errorMsg.classList.remove('hidden');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                loading.classList.add('hidden');
                errorMsg.innerText = 'Terjadi kesalahan jaringan atau server.';
                errorMsg.classList.remove('hidden');
            });
        });

        // Proteksi Halaman Login
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                const role = sessionStorage.getItem('role');
                if (role === 'Admin') window.location.href = 'dashboard-admin.html';
                if (role === 'Guru') window.location.href = 'dashboard-guru.html';
            }
        };
    </script>
</body>
</html>
